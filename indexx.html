<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema - Centro de Prácticas</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0d6efd 0%, #0a2540 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            max-width: 420px;
            width: 100%;
        }
        .login-header {
            background-color: #ffffff;
            padding: 2rem 2rem 1rem;
            text-align: center;
        }
        .brand-icon {
            width: 64px;
            height: 64px;
            background-color: #e7f1ff;
            color: #0d6efd;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <div class="container px-3">
        <div class="card login-card mx-auto">
            <!-- Encabezado y Branding -->
            <div class="login-header">
                <div class="brand-icon">
                    <i class="bi bi-building-lock"></i>
                </div>
                <h4 class="fw-bold text-dark mb-1">Portal de Acceso</h4>
                <p class="text-muted small mb-0">Sistema de Gestión - Centro de Prácticas</p>
            </div>

            <!-- Cuerpo del Formulario -->
            <div class="card-body p-4 pt-2 bg-white">
                <form id="loginForm" novalidate>
                    <!-- Campo Usuario / Correo -->
                    <div class="mb-3">
                        <label for="usuario" class="form-label fw-semibold small">Correo institucional o usuario</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                            <input type="email" class="form-control" id="usuario" placeholder="ejemplo@empresa.com" required>
                            <div class="invalid-feedback">
                                Por favor, ingresa un correo o usuario válido.
                            </div>
                        </div>
                    </div>

                    <!-- Campo Contraseña -->
                    <div class="mb-3">
                        <div class="d-flex justify-content-between">
                            <label for="password" class="form-label fw-semibold small">Contraseña</label>
                            <a href="#" class="text-decoration-none small">¿Olvidaste tu clave?</a>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" placeholder="••••••••" required minlength="6">
                            <button class="btn btn-outline-secondary" type="button" id="togglePassword" title="Mostrar/Ocultar contraseña">
                                <i class="bi bi-eye" id="eyeIcon"></i>
                            </button>
                            <div class="invalid-feedback">
                                La contraseña debe tener al menos 6 caracteres.
                            </div>
                        </div>
                    </div>

                    <!-- Recordar sesión -->
                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input" id="recordar">
                        <label class="form-check-label small text-muted" for="recordar">Mantener sesión iniciada</label>
                    </div>

                    <!-- Botón de envío -->
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg fw-semibold fs-6">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
                        </button>
                    </div>
                </form>

                <!-- Alerta de demostración -->
                <div id="mensajeAlerta" class="alert alert-success mt-3 mb-0 d-none small" role="alert">
                    <i class="bi bi-check-circle-fill me-1"></i> Validación correcta. Redirigiendo al panel...
                </div>
            </div>

            <!-- Pie de tarjeta -->
            <div class="card-footer bg-light text-center py-3 border-0">
                <small class="text-muted">© 2026 Área de Sistemas - Todos los derechos reservados</small>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Script para mostrar/ocultar contraseña y validar -->
    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            eyeIcon.classList.toggle('bi-eye');
            eyeIcon.classList.toggle('bi-eye-slash');
        });

        const form = document.getElementById('loginForm');
        const alerta = document.getElementById('mensajeAlerta');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (!form.checkValidity()) {
                e.stopPropagation();
                alerta.classList.add('d-none');
            } else {
                alerta.classList.remove('d-none');
            }
            form.classList.add('was-validated');
        });
    </script>
</body>
</html>
